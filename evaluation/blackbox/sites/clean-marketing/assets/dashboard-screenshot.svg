<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-labelledby="dashTitle dashDesc">
  <title id="dashTitle">Loomstack timeline view mockup</title>
  <desc id="dashDesc">A mockup of the Loomstack timeline view showing four horizontal task bars of different lengths plotted against a two-week calendar header, illustrating how tasks and their durations line up across a project schedule.</desc>
  <rect width="560" height="340" rx="14" fill="#ffffff" stroke="#dde2ee" stroke-width="2"/>
  <rect x="0" y="0" width="560" height="44" rx="14" fill="#f4f6fb"/>
  <text x="20" y="28" font-family="Arial, sans-serif" font-size="15" fill="#16213a" font-weight="bold">Week 1</text>
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="15" fill="#16213a" font-weight="bold">Week 2</text>
  <line x1="280" y1="0" x2="280" y2="340" stroke="#dde2ee" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#37415c">
    <text x="20" y="90">Research</text>
    <rect x="110" y="72" width="120" height="20" rx="5" fill="#0f7a6b"/>
    <text x="20" y="140">Wireframes</text>
    <rect x="150" y="122" width="160" height="20" rx="5" fill="#0f7a6b"/>
    <text x="20" y="190">Build</text>
    <rect x="200" y="172" width="220" height="20" rx="5" fill="#e6a13a"/>
    <text x="20" y="240">Launch</text>
    <rect x="420" y="222" width="90" height="20" rx="5" fill="#37415c"/>
  </g>
</svg>
